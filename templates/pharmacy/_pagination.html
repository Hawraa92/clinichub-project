{% if page_obj.paginator.num_pages > 1 %}
<nav class="mt-4" aria-label="Pagination">
    <ul class="pagination justify-content-center">
        {% if page_obj.has_previous %}
            <li class="page-item">
                <a
                    class="page-link"
                    href="?page={{ page_obj.previous_page_number }}&q={{ request.GET.q|urlencode }}&status={{ request.GET.status|urlencode }}&payment_status={{ request.GET.payment_status|urlencode }}&priority={{ request.GET.priority|urlencode }}&pharmacy={{ request.GET.pharmacy|urlencode }}&stock={{ request.GET.stock|urlencode }}&state={{ request.GET.state|urlencode }}&type={{ request.GET.type|urlencode }}"
                >
                    Previous
                </a>
            </li>
        {% endif %}

        <li class="page-item active" aria-current="page">
            <span class="page-link">
                {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}
            </span>
        </li>

        {% if page_obj.has_next %}
            <li class="page-item">
                <a
                    class="page-link"
                    href="?page={{ page_obj.next_page_number }}&q={{ request.GET.q|urlencode }}&status={{ request.GET.status|urlencode }}&payment_status={{ request.GET.payment_status|urlencode }}&priority={{ request.GET.priority|urlencode }}&pharmacy={{ request.GET.pharmacy|urlencode }}&stock={{ request.GET.stock|urlencode }}&state={{ request.GET.state|urlencode }}&type={{ request.GET.type|urlencode }}"
                >
                    Next
                </a>
            </li>
        {% endif %}
    </ul>
</nav>
{% endif %}
