services:
  db:
    image: postgres:16
    container_name: clinichub_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinichub
      POSTGRES_USER: clinichub
      POSTGRES_PASSWORD: clinichub_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinichub -d clinichub"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: clinichub_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    ports:
      - "8000:8000"

volumes:
  postgres_data: